aid: xiaoniaokuaiyan
name: xiaoniaokuaiyan
description: 'Xiaoniaokuaiyan (小鸟快验) is an in-home health-checkup and blood-testing
  service brand operated by Beijing Cloud Artery Health Management Co., Ltd (北京云动脉健康管理有限公司),
  a Qiming-backed internet-healthcare startup based in Chaoyang, Beijing. It offers
  on-demand at-home sample collection by licensed nurses with results processed by
  nationally accredited laboratories, spanning routine checkups, tumor screening,
  infection testing, chronic-disease monitoring, and custom corporate and family panels.
  The company operates via its consumer website, WeChat official account, and mobile
  apps; it publishes no public developer portal, documentation, or API surface. This
  profile was added to the API Evangelist network as a Qiming portfolio lead and enriched
  by the pipeline; the honest result is that no public API artifacts exist to harvest.'
